[project]
name = "hirely"
version = "0.1.0"
description = "Zero-cost AI career suite: Streamlit app with Ollama and free-verified OpenRouter providers."
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.66.1",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "pymupdf==2.0",
    "python-docx==1.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored third-party skill content is preserved as-is and not linted.
extend-exclude = [".agents", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # Line length handled by the formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# PyMuPDF (imported as "fitz") ships no type stubs.
[[tool.mypy.overrides]]
module = "fitz.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
